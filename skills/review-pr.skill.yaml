# Skill Definition Schema
# Version: 1.0.0
# Reference: https://github.com/dvnuo/engineering-flow-platform/issues/169

name: review-pr
description: Review a GitHub pull request
version: 1.0.0
owner: devops-team

# Trigger patterns - user messages that activate this skill
trigger:
  - "review pr"
  - "code review"
  - "analyze pull request"
  - "/skill review-pr"
  - "/review-pr"

# Tools this skill is allowed to use
# LLM cannot call tools outside this list (deterministic guardrail)
tools:
  - github_get_pr
  - github_get_diff
  - github_comment_pr

# Execution strategy - guidance for LLM
strategy:
  - "1. Fetch PR details using github_get_pr"
  - "2. Analyze the diff using github_get_diff"
  - "3. Generate structured review feedback"
  - "4. Comment on the PR with findings"

# Expected output format
output_format: markdown

# Optional: deprecation flag
# deprecated: false
