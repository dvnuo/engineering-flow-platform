version: '3.8'

services:
  engineering-flow-platform:
    build: .
    container_name: engineering-flow-platform-bot
    ports:
      - "8000:8000"
    volumes:
      # Config file - required
      - ./config.yaml:/app/config.yaml:ro

      # Runtime workspace directory - persists across restarts.
      # Contains AGENTS.md and project working files.
      - ./workspace:/workspace

      # Optional: logs directory
      - ./logs:/app/logs
    environment:
      - EFP_LLM_API_KEY=${EFP_LLM_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Example workspace structure after running:
# ./workspace/
# |-- AGENTS.md      # Workspace instructions
# `-- project files
