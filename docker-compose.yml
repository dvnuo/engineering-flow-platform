version: '3.8'

services:
  engineering-flow-platform:
    build: .
    container_name: engineering-flow-platform-bot
    ports:
      - "8000:8000"
    volumes:
      # Config file - required
      - ./config.yaml:/app/config.yaml:ro
      
      # Workspace directory for memory files - persists across restarts.
      # This compose setup maps to the container's root-user home workspace path.
      # It is a local dev-container default, not a universal cross-environment path contract.
      # Contains: SOUL.md, USER.md, AGENTS.md, TOOLS.md, MEMORY.md, memory/
      - ./workspace:/root/.efp/workspace
      
      # Optional: logs directory
      - ./logs:/app/logs
    environment:
      - EFP_LLM_API_KEY=${EFP_LLM_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Example workspace structure after running:
# ./workspace/
# ├── SOUL.md        # Agent persona
# ├── USER.md        # User preferences
# ├── AGENTS.md      # Workspace conventions
# ├── TOOLS.md       # Tool configurations
# ├── MEMORY.md      # Long-term memory
# └── memory/
#     ├── 2026-02-01.md
#     └── 2026-02-02.md
