# OpenClaw Mini Configuration

# Discord Channel
discord:
  mode: "bot"  # "bot" for Bot API mode (recommended), "webhook" for Webhook mode
  bot_token: "YOUR_DISCORD_BOT_TOKEN"
  channel_id: "YOUR_CHANNEL_ID"
  # webhook_url: "https://discord.com/api/webhooks/..."  # Only needed for webhook mode

# LLM Configuration
llm:
  provider: "openai"  # openai, anthropic, github_copilot, custom
  api_base: "https://api.openai.com/v1"
  api_key: "YOUR_API_KEY"
  model: "gpt-3.5-turbo"
  max_tokens: 1000
  temperature: 0.7
  max_retries: 3  # Number of retry attempts for API failures
  retry_delay: 1  # Base delay in seconds (exponential backoff)

# GitHub Copilot Configuration Example:
# llm:
#   provider: "github_copilot"
#   api_base: "https://api.github.com/copilot"
#   api_key: "ghp_YOUR_GITHUB_TOKEN"
#   model: "gpt-4"  # or "gpt-3.5-turbo"
#   max_tokens: 1000
#   temperature: 0.7

# Session Configuration
session:
  max_history: 5  # 保留最近5轮对话

# Server Configuration (only used in webhook mode)
server:
  host: "0.0.0.0"
  port: 8000
