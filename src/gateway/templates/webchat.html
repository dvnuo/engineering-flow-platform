<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Flow Platform - Chat</title>
    <link rel="stylesheet" href="/static/css/webchat.css">
</head>
<body>
    <div class="header">
        <div class="logo">EFP</div>
        <div>
            <div class="header-title">Engineering Flow Platform Assistant</div>
            <div class="header-subtitle">AI-Powered Personal Assistant</div>
        </div>
        <button class="stats-button" id="statsButton" title="View Usage Stats">📊</button>
    </div>
    
    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="welcome-message">
                <h2>👋 Welcome!</h2>
                <p>I'm your AI assistant. How can I help you today?</p>
            </div>
        </div>
        
        <div class="typing-indicator" id="typing">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <div class="skill-selector" id="skillSelector">
                    <div class="skill-selector-dropdown" id="skillDropdown">
                        <div class="skill-selector-header">Available Skills</div>
                        <div class="skill-list" id="skillList">
                            <div class="skill-item" data-command="/git">
                                <span class="skill-emoji">🔧</span>
                                <span class="skill-name">git</span>
                                <span class="skill-desc">Execute git commands</span>
                            </div>
                        </div>
                    </div>
                </div>
                <textarea 
                    class="input-field" 
                    id="messageInput" 
                    placeholder="Type a message or / for skills..."
                    rows="1"
                ></textarea>
                <button class="send-button" id="sendButton">Send</button>
            </div>
        </div>
    </div>
    
    <div class="status-bar">
        <span id="status">Ready</span>
        <span id="tokenCount">Tokens: 0</span>
        <span id="costDisplay">Cost: $0.00</span>
    </div>
    
    <!-- Usage Stats Modal -->
    <div class="modal" id="statsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📊 Usage Statistics</h2>
                <button class="close-button" id="closeStats">&times;</button>
            </div>
            <div class="modal-body" id="statsContent">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/webchat.js"></script>
</body>
</html>
