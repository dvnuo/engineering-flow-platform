<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Flow Platform - Chat</title>
    
    <!-- OpenClaw-inspired Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/css/webchat.css">
</head>
<body>
    <!-- Shell Layout (like OpenClaw) -->
    <div class="shell">
        <!-- Navigation Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">EFP</div>
                <span class="sidebar-title">Engineering Flow</span>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-section-title">Chat</div>
                <a href="#" class="sidebar-item active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>New Chat</span>
                </a>
                <a href="#" class="sidebar-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span>Recent</span>
                </a>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-section-title">Tools</div>
                <a href="#" class="sidebar-item" onclick="alert('File Explorer - Coming soon')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>Files</span>
                </a>
                <a href="#" class="sidebar-item" onclick="alert('Terminal - Coming soon')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="4 17 10 11 4 5"/>
                        <line x1="12" y1="19" x2="20" y2="19"/>
                    </svg>
                    <span>Terminal</span>
                </a>
            </div>
            
            <div class="sidebar-footer">
                <a href="#" class="sidebar-item" onclick="alert('Settings - Coming soon')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    <span>Settings</span>
                </a>
            </div>
        </nav>
        
        <!-- Main Content Area -->
        <div class="main-area">
            <!-- Header -->
            <header class="topbar">
                <button class="toggle-sidebar" id="toggleSidebar" aria-label="Toggle sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <div class="topbar-title">Engineering Flow Platform</div>
                <button class="stats-button" id="statsButton" title="View Usage Stats" aria-label="View usage statistics">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 20V10"/>
                        <path d="M18 20V4"/>
                        <path d="M6 20v-4"/>
                    </svg>
                </button>
            </header>
            
            <!-- Chat Container -->
            <main class="chat-container">
                <div class="messages" id="messages" role="log" aria-live="polite">
                    <div class="welcome-message">
                        <h2>👋 Welcome!</h2>
                        <p>I'm your AI assistant. How can I help you today?</p>
                    </div>
                </div>
                
                <div class="typing-indicator" id="typing" role="status" aria-label="Assistant is typing">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
                
                <!-- Streaming Content (for SSE) -->
                <div class="streaming-content" id="streamingContent"></div>
                
                <!-- Input Area -->
                <div class="input-area">
                    <div class="input-wrapper">
                        <div class="skill-selector" id="skillSelector" role="combobox" aria-expanded="false" aria-haspopup="listbox">
                            <div class="skill-selector-dropdown" id="skillDropdown" role="listbox" aria-label="Available Skills">
                                <div class="skill-selector-header">Available Skills</div>
                                <div class="skill-list" id="skillList" role="listbox"></div>
                            </div>
                        </div>
                        <textarea 
                            class="input-field" 
                            id="messageInput" 
                            placeholder="Type a message or / for skills..."
                            rows="1"
                            aria-label="Message input"
                        ></textarea>
                        <button class="send-button" id="sendButton">Send</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <!-- Status Bar -->
    <footer class="status-bar" role="contentinfo">
        <span id="status">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 6v6l4 2"/>
            </svg>
            Ready
        </span>
        <button class="clear-button" id="clearButton" title="Clear chat">Clear</button>
        <span id="tokenCount">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
            </svg>
            Tokens: 0
        </span>
        <span id="costDisplay">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="1" x2="12" y2="23"/>
                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
            Cost: $0.00
        </span>
    </footer>
    
    <!-- Usage Stats Modal -->
    <div class="modal" id="statsModal" role="dialog" aria-modal="true" aria-labelledby="statsTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="statsTitle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 8px;">
                        <path d="M12 20V10"/>
                        <path d="M18 20V4"/>
                        <path d="M6 20v-4"/>
                    </svg>
                    Usage Statistics
                </h2>
                <button class="close-button" id="closeStats" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body" id="statsContent" role="region" aria-live="polite">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>
    
    <!-- Skill Selector Live Region for Screen Readers -->
    <div id="skillAriaLive" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    
    <!-- Screen Reader Only Styles -->
    <style>
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
    
    <script src="/static/js/webchat.js"></script>
</body>
</html>
