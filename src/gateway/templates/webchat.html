<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Flow Platform - Chat</title>
    <link rel="stylesheet" href="/static/css/webchat.css">
</head>
<body>
    <div class="header">
        <div class="logo">EFP</div>
        <div>
            <div class="header-title">Engineering Flow Platform Assistant</div>
            <div class="header-subtitle">AI-Powered Personal Assistant</div>
        </div>
        <button class="stats-button" id="statsButton" title="View Usage Stats">📊</button>
    </div>
    
    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="welcome-message">
                <h2>👋 Welcome!</h2>
                <p>I'm your AI assistant. How can I help you today?</p>
            </div>
        </div>
        
        <div class="typing-indicator" id="typing">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <div class="skill-selector" id="skillSelector">
                    <div class="skill-selector-dropdown" id="skillDropdown" role="listbox" aria-label="Available Skills">
                        <div class="skill-selector-header">Available Skills</div>
                        <div class="skill-list" id="skillList" role="listbox"></div>
                    </div>
                </div>
                <textarea 
                    class="input-field" 
                    id="messageInput" 
                    placeholder="Type a message or / for skills..."
                    rows="1"
                ></textarea>
                <button class="send-button" id="sendButton">Send</button>
            </div>
        </div>
    </div>
    
    <div class="status-bar">
        <span id="status">Ready</span>
        <span id="tokenCount">Tokens: 0</span>
        <span id="costDisplay">Cost: $0.00</span>
    </div>
    
    <!-- Usage Stats Modal -->
    <div class="modal" id="statsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📊 Usage Statistics</h2>
                <button class="close-button" id="closeStats" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body" id="statsContent" role="region" aria-live="polite">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>
    
    <!-- Skill Selector Live Region for Screen Readers -->
    <div id="skillAriaLive" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    
    <!-- Screen Reader Only Styles -->
    <style>
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
    
    <script src="/static/js/webchat.js"></script>
</body>
</html>
