name: Build Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The tools repo is private: the TOOLS_REPO_TOKEN secret reads it, GITHUB_TOKEN
      # cannot. Without it a pull request skips the image steps with a warning; a
      # push, tag or manual run fails here, so publishing cannot stop silently.
      - name: Checkout runtime tools source
        id: tools
        uses: ./.github/actions/runtime-tools-source
        with:
          repository: dvnuo/engineering-flow-platform-tools
          path: engineering-flow-platform-tools
          token: ${{ secrets.TOOLS_REPO_TOKEN || github.token }}
          required: ${{ github.event_name != 'pull_request' }}

      - name: Set up Go for runtime tools
        if: steps.tools.outputs.available == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: engineering-flow-platform-tools/go.mod

      - name: Prepare runtime tool binaries
        if: steps.tools.outputs.available == 'true'
        run: EFP_TOOLS_REPO_DIR=engineering-flow-platform-tools scripts/prepare-runtime-tools.sh

      - name: Normalize image name
        if: steps.tools.outputs.available == 'true'
        id: prep
        run: echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.tools.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        if: steps.tools.outputs.available == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.prep.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GitHub Container Registry
        if: steps.tools.outputs.available == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.tools.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
