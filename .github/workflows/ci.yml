name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  native-runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Prepare workspace directories
        run: |
          sudo mkdir -p /workspace/uploads /workspace/file_context/sessions
          sudo chown -R "$USER":"$USER" /workspace
      - env:
          PYTHONPATH: .
          EFP_EXTERNAL_TOOLS_STRICT: "false"
        run: |
          python - <<'PY'
          from pathlib import Path
          tests = [
            "tests/test_chat_csv_attachment_context.py",
            "tests/test_file_context_table_markdown_fallback.py",
            "tests/test_agent_llm_tools_surface.py",
            "tests/test_capability_registry.py",
            "tests/test_runtime_capability_contract.py",
            "tests/test_runtime_contract_fixture.py",
            "tests/test_runtime_observability_contract.py",
            "tests/test_p3_docs_contract.py",
            "tests/test_logger.py",
            "tests/test_docker_runtime_contract.py",
            "tests/test_skill_repo_path.py",
            "tests/runtime/test_interactive_question_tool.py",
            "tests/runtime/test_system_prompt_stack.py",
          ]
          missing = [p for p in tests if not Path(p).exists()]
          if missing:
              raise SystemExit("Missing CI test files: " + ", ".join(missing))
          print("CI tests verified:", ", ".join(tests))
          PY
          python -m pytest -q \
            tests/test_chat_csv_attachment_context.py \
            tests/test_file_context_table_markdown_fallback.py \
            tests/test_agent_llm_tools_surface.py \
            tests/test_capability_registry.py \
            tests/test_runtime_capability_contract.py \
            tests/test_runtime_contract_fixture.py \
            tests/test_runtime_observability_contract.py \
            tests/test_p3_docs_contract.py \
            tests/test_logger.py \
            tests/test_docker_runtime_contract.py \
            tests/test_skill_repo_path.py \
            tests/runtime/test_interactive_question_tool.py \
            tests/runtime/test_system_prompt_stack.py

  native-runtime-docker-smoke:
    runs-on: ubuntu-latest
    needs: native-runtime-tests
    # Heavy full-image integration smoke (builds the tools repo + Docker image).
    # Informational but non-blocking so it cannot red the run; the unit-test job
    # is the gating check.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Checkout runtime tools source
        uses: actions/checkout@v4
        with:
          repository: dvnuo/engineering-flow-platform-tools
          path: engineering-flow-platform-tools
      - name: Set up Go for runtime tools
        uses: actions/setup-go@v5
        with:
          go-version-file: engineering-flow-platform-tools/go.mod
      - name: Prepare runtime tool binaries
        run: EFP_TOOLS_REPO_DIR=engineering-flow-platform-tools scripts/prepare-runtime-tools.sh
      - run: docker build -t efp-native-runtime-ci .
      - run: |
          set -euo pipefail
          trap 'docker logs efp-native-runtime-ci || true; docker rm -f efp-native-runtime-ci || true' EXIT
          docker run -d \
            --name efp-native-runtime-ci \
            -p 8000:8000 \
            -e EFP_EXTERNAL_TOOLS_STRICT=false \
            -e PYTHONUNBUFFERED=1 \
            efp-native-runtime-ci
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            docker logs efp-native-runtime-ci || true
            sleep 2
          done
          docker logs efp-native-runtime-ci || true
          exit 1
